[env:super_mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; monitor_dtr = 0
; monitor_rts = 0
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit MPU6050@^2.2.9
	citycafe578/FixedPID@^1.1.0
